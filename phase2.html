<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini React · Phase 2</title>
    <link rel="stylesheet" href="/src/app/style.css" />
    <link rel="stylesheet" href="/src/app/phase2/phase2.css" />
  </head>
  <body>
    <header class="header">
      <h1>Mini React <span>Phase 2 · Component + State + Hooks — 훅 실험실</span></h1>
      <nav class="page-nav">
        <a href="/index.html">Phase 1 데모</a>
        <a href="/phase2.html" aria-current="page">Phase 2 데모</a>
      </nav>
    </header>

    <main class="areas">
      <section class="area">
        <h2 class="area-title">앱 영역 <small>루트 App만 상태를 갖고, 패널은 props만 받습니다</small></h2>
        <!-- FunctionComponent가 이 안을 mount / update 한다. -->
        <div id="app" class="lab"></div>
      </section>

      <section class="area">
        <h2 class="area-title">인스펙터 <small>라이브러리 바깥의 일반 DOM</small></h2>
        <p class="render-count">렌더 횟수 <strong id="render-count">0</strong></p>
        <h3 class="inspector-title">App의 hooks 배열</h3>
        <table class="hooks-table">
          <thead>
            <tr><th>칸</th><th>종류</th><th>저장된 값</th><th>deps</th></tr>
          </thead>
          <tbody id="hooks-body"></tbody>
        </table>
        <h3 class="inspector-title">
          실행 로그 <button id="btn-clear-log" type="button" class="small">지우기</button>
        </h3>
        <ol id="event-log" class="event-log"></ol>
      </section>
    </main>

    <script type="module" src="/src/app/phase2/main.js"></script>
  </body>
</html>
