services:
  dev:
    build: .
    image: jungle-mini-react-dev
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - .:/app                         # 소스 코드는 호스트와 실시간 동기화
      - node_modules:/app/node_modules # node_modules는 컨테이너 전용 볼륨
    stdin_open: true
    tty: true
    command: bash

volumes:
  node_modules:
